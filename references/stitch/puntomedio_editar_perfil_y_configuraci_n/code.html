<body class="bg-light-surface-secondary text-primary font-body min-h-[884px] antialiased flex flex-col justify-between selection:bg-accent/20" data-stitch-vh="min-h-[884px]===min-h-screen">

  <!-- Mobile View Container -->
  <div class="flex-1 flex flex-col max-w-[430px] mx-auto w-full pb-20">

    <!-- Top App Navigation Header -->
    <header class="sticky top-0 z-30 bg-light-surface border-b border-outline px-5 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button type="button" aria-label="Volver" class="w-10 h-10 rounded-lg border border-outline bg-light-surface text-primary flex items-center justify-center hover:bg-light-surface-secondary transition-colors">
          <span class="material-symbols-outlined text-[20px]">arrow_back</span>
        </button>
        <span class="font-headline text-title-lg font-bold text-primary">Mi Perfil y Ajustes</span>
      </div>
      <button type="button" class="text-label-md font-semibold text-primary hover:text-accent transition-colors">
        Guardar
      </button>
    </header>

    <!-- Main Content -->
    <main class="flex-1 px-5 pt-5 space-y-6">

      <!-- Edit Avatar Header Section -->
      <section class="flex flex-col items-center">
        <div class="relative">
          <div class="w-24 h-24 rounded-full bg-light-surface border-2 border-primary/20 flex items-center justify-center text-primary font-bold text-headline-lg overflow-hidden shadow-xs">
            CP
          </div>
          <button type="button" aria-label="Cambiar foto de perfil" class="absolute bottom-0 right-0 w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-xs hover:bg-[#34304e] transition-colors">
            <span class="material-symbols-outlined text-[16px]">edit</span>
          </button>
        </div>
        <span class="text-label-sm font-semibold text-primary mt-2">Carlos Palacios</span>
        <span class="text-body-sm text-light-on-surface-variant">carlos.palacios@ejemplo.com</span>
      </section>

      <!-- Personal Info Fields -->
      <section class="bg-light-surface border border-outline rounded-xl p-4 space-y-4">
        <h2 class="font-title text-title-lg font-semibold text-primary border-b border-outline pb-2">
          Datos de la cuenta
        </h2>

        <label class="block">
          <span class="text-primary font-label text-label-md block mb-1">Nombre para mostrar</span>
          <input type="text" value="Carlos Palacios" class="w-full bg-light-surface-secondary border border-outline rounded-lg px-3.5 py-2.5 text-primary text-body-md focus:border-primary focus:outline-none">
        </label>

        <label class="block">
          <span class="text-primary font-label text-label-md block mb-1">Teléfono verificado</span>
          <div class="flex items-center justify-between bg-light-surface-secondary border border-outline rounded-lg px-3.5 py-2.5">
            <span class="text-primary text-body-md tabular-nums">+52 55 9876 5432</span>
            <span class="text-label-sm text-success font-semibold flex items-center gap-1">
              <span class="material-symbols-outlined text-[16px]">verified</span> Verificado
            </span>
          </div>
        </label>

        <label class="block">
          <span class="text-primary font-label text-label-md block mb-1">Zona habitual</span>
          <input type="text" value="Benito Juárez / Coyoacán, CDMX" class="w-full bg-light-surface-secondary border border-outline rounded-lg px-3.5 py-2.5 text-primary text-body-md focus:border-primary focus:outline-none">
        </label>
      </section>

      <!-- Mode & Profile Roles Switch (Solicitante vs Repartidor) -->
      <section class="bg-light-surface border border-outline rounded-xl p-4 space-y-3">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="font-title text-title-lg font-semibold text-primary">Modo Repartidor</h2>
            <p class="text-body-sm text-light-on-surface-variant">Postúlate para recoger y entregar encargos</p>
          </div>
          <button type="button" role="switch" aria-checked="true" class="w-12 h-6 rounded-full bg-primary relative transition-colors">
            <span class="w-5 h-5 rounded-full bg-on-primary absolute top-0.5 right-0.5 shadow-xs transition-transform"></span>
          </button>
        </div>
      </section>

      <!-- Security & Preferences List -->
      <section class="bg-light-surface border border-outline rounded-xl overflow-hidden divide-y divide-outline">
        <a href="#" class="p-4 flex items-center justify-between hover:bg-light-surface-secondary transition-colors">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-[20px] text-light-on-surface-variant">lock</span>
            <span class="font-title text-title-md text-primary">Seguridad y PIN de entrega</span>
          </div>
          <span class="material-symbols-outlined text-[18px] text-light-on-surface-variant">chevron_right</span>
        </a>

        <a href="#" class="p-4 flex items-center justify-between hover:bg-light-surface-secondary transition-colors">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-[20px] text-light-on-surface-variant">credit_card</span>
            <span class="font-title text-title-md text-primary">Métodos de pago guardados</span>
          </div>
          <span class="material-symbols-outlined text-[18px] text-light-on-surface-variant">chevron_right</span>
        </a>

        <a href="#" class="p-4 flex items-center justify-between hover:bg-light-surface-secondary transition-colors">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-[20px] text-light-on-surface-variant">watch</span>
            <span class="font-title text-title-md text-primary">Vincular smartwatch Wear OS</span>
          </div>
          <span class="text-label-sm text-success font-medium">Conectado</span>
        </a>

        <button type="button" class="w-full p-4 flex items-center justify-between hover:bg-light-surface-secondary transition-colors text-left text-error">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-[20px] text-error">logout</span>
            <span class="font-title text-title-md font-semibold">Cerrar sesión</span>
          </div>
        </button>
      </section>

    </main>

    <!-- Shared 5-tab Bottom Navigation -->
    <nav class="fixed bottom-0 inset-x-0 bg-light-surface border-t border-outline max-w-[430px] mx-auto z-40 px-2 py-1.5 flex items-center justify-around" aria-label="Navegación principal">
      <button type="button" class="flex flex-col items-center justify-center py-1 px-3 text-light-on-surface-variant hover:text-primary transition-colors">
        <span class="material-symbols-outlined text-[24px]">home</span>
        <span class="font-label text-label-sm mt-0.5">Inicio</span>
      </button>
      <button type="button" class="flex flex-col items-center justify-center py-1 px-3 text-light-on-surface-variant hover:text-primary transition-colors">
        <span class="material-symbols-outlined text-[24px]">explore</span>
        <span class="font-label text-label-sm mt-0.5">Explorar</span>
      </button>
      <button type="button" class="flex flex-col items-center justify-center py-1 px-3 text-light-on-surface-variant hover:text-primary transition-colors">
        <span class="material-symbols-outlined text-[24px]">receipt_long</span>
        <span class="font-label text-label-sm mt-0.5">Actividad</span>
      </button>
      <button type="button" class="flex flex-col items-center justify-center py-1 px-3 text-light-on-surface-variant hover:text-primary transition-colors">
        <span class="material-symbols-outlined text-[24px]">chat_bubble_outline</span>
        <span class="font-label text-label-sm mt-0.5">Mensajes</span>
      </button>
      <button type="button" class="flex flex-col items-center justify-center py-1 px-3 text-primary transition-colors" aria-current="page">
        <span class="material-symbols-outlined text-[24px]">person</span>
        <span class="font-label text-label-sm mt-0.5 font-semibold">Perfil</span>
      </button>
    </nav>

  </div>
